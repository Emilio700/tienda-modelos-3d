version: "3.8"

services:
  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - microservices-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Search Service
  search-service:
    build:
      context: ./microservices/search-service
      dockerfile: Dockerfile
    container_name: search-service
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - SEARCH_SERVICE_PORT=3001
    ports:
      - "3001:3001"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microservices-network
    restart: unless-stopped

  # Operations Service
  operations-service:
    build:
      context: ./microservices/operations-service
      dockerfile: Dockerfile
    container_name: operations-service
    environment:
      - OPERATIONS_SERVICE_PORT=3002
      - JWT_SECRET=demo-secret-key-for-3d-models-store-123
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
    networks:
      - microservices-network
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
    depends_on:
      - gateway
    networks:
      - microservices-network
    restart: unless-stopped

  # API Gateway (nginx)
  gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./microservices/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - search-service
      - operations-service
    networks:
      - microservices-network
    restart: unless-stopped

networks:
  microservices-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local
