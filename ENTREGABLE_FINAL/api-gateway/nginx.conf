events {
    worker_connections 1024;
}

http {
    upstream search-service {
        server search-service:3001;
    }

    upstream operations-service {
        server operations-service:3002;
    }

    server {
        listen 8080;
        server_name localhost;

        # Health check
        location /health {
            access_log off;
            return 200 "API Gateway OK\n";
            add_header Content-Type text/plain;
        }

        # Search Service Routes - all /api/search/* and /api/productos/*
        location ~ ^/api/(productos|search) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://search-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }


        # Operations Service Routes - all /api/auth/* and /api/users/*
        location ~ ^/api/(auth|users) {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://operations-service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Default route
        location / {
            return 404 "Not Found";
        }
    }
}
